[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuebot-dashboard"
version = "0.1.0"
description = "Manual control dashboard for the Rescuebot project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pyserial>=3.5,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
rescuebot-dashboard = "rescuebot.web:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
rescuebot = ["static/*", "static/fonts/*"]
