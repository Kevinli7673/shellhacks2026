; PlatformIO project for the Rescuebot ESP32-S2 controller.
; See docs/handoffs/esp32-controller.md for status and open hardware facts.

[env:esp32-s2]
platform = espressif32
; Confirmed 2026-09-26: Adafruit QT Py ESP32-S2. Its board definition enables
; USB CDC on boot, so Serial is the native USB port. I2C uses default Wire:
; SDA=GPIO7, SCL=GPIO6; motor shield=0x60, BNO055=0x28, BMP280=0x77.
board = adafruit_qtpy_esp32s2
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit Motor Shield V2 Library @ ^1.1.3
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
; test_dir left at PlatformIO's default ("test/"); hardware-dependent code
; lives behind #ifdef ARDUINO in motor_shield.cpp, imu_bno055.cpp, and
; main.cpp, so it is excluded from native test builds without needing
; separate source filters here.

[env:native]
; Runs the pure-logic behavioral fixtures (mixing, session/watchdog,
; protocol parsing) on the host, with no board or hardware required:
;   pio test -e native
platform = native
; Without this, PlatformIO only compiles test/*.cpp against the headers in
; include/ and never links the matching src/*.cpp definitions, so every
; test suite fails to link with undefined symbols (rescuebot::mix,
; rescuebot::SessionGuard, ...).
test_build_src = yes
; Unity ships with double-precision assertions (TEST_ASSERT_EQUAL_DOUBLE)
; disabled by default; without this flag those assertions report "Unity
; Double Precision Disabled" instead of actually comparing.
build_flags =
    -std=c++17
    -D UNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
