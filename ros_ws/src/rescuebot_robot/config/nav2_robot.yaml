# Physical-robot overrides, loaded after rescuebot_navigation's nav2.yaml and
# collision_monitor.yaml by autonomy.launch.py (the simulation keeps those).
#
# Robot space: an 8 in (0.203 m) radius around the LiDAR, which sits at
# base_link. dashboard_bridge drops LiDAR returns inside it (range_min in
# mapping.launch.py), so the robot's own parts never count as obstacles.
collision_monitor:
  ros__parameters:
    polygons: [RobotApproach]
    # Direction-aware: slow down, then stop, only when the current motion
    # would reach an obstacle within time_before_collision. A pillar behind or
    # beside the robot no longer blocks a move away from it.
    RobotApproach:
      type: circle
      radius: 0.203
      action_type: approach
      time_before_collision: 1.2
      simulation_time_step: 0.05
      min_points: 4
      visualize: true

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.203

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.203

# Set-distance goals keep the robot's heading (mission manager
# goal_keeps_heading), so a goal behind or beside the robot is reached by
# reversing or strafing. Never rotate in place toward the path first (the
# rotation shim engages only above this angle, and no angle exceeds pi), and
# don't penalize reversing. Search legs use SearchPath, which is unchanged:
# there the camera should face the direction of travel.
controller_server:
  ros__parameters:
    FollowPath:
      angular_dist_threshold: 3.2
      PreferForward.scale: 0.0
