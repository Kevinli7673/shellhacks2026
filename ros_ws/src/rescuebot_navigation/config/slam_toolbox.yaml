slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.08
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 8.0
    throttle_scans: 1
    # Repeated walls in the 6 m demo can otherwise match distant locations
    # inside the default 8 m loop search window. Keep loop closure local.
    loop_search_maximum_distance: 0.6
    loop_search_space_dimension: 1.0
    loop_match_minimum_response_coarse: 0.55
    loop_match_minimum_response_fine: 0.65
